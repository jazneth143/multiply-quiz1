<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Math Blitz Pro</title>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161e;
            --accent: #10b981;
            --text: #ececed;
            --secondary: #3b82f6;
            --danger: #f43f5e;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }

        body {
            font-family: -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            touch-action: manipulation;
        }

        .screen { flex: 1; display: flex; flex-direction: column; padding: 20px; align-items: center; overflow-y: auto; }
        .hidden { display: none !important; }

        /* --- Setup Screen & History --- */
        #setup-screen h1 { font-size: 2.2rem; margin-top: 20px; color: var(--accent); }
        
        .history-container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            border-radius: 15px;
            margin-top: 25px;
            padding: 15px;
            border: 1px solid #2d2d39;
        }

        .history-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold; border-bottom: 1px solid #2d2d39; padding-bottom: 5px; font-size: 0.8rem; color: #888; }
        
        #history-list { 
            max-height: 180px; 
            overflow-y: auto; 
            font-size: 0.9rem;
        }

        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1f1f29; }
        .lvl-insane { color: var(--danger); }
        .lvl-standard { color: var(--secondary); }
        .lvl-relaxed { color: var(--accent); }

        /* --- Game UI --- */
        #timer-bar { position: fixed; top: 0; left: 0; height: 6px; background: var(--accent); width: 100%; transition: width 0.1s linear; }
        
        .flash-card {
            background: var(--card-bg);
            width: 100%;
            max-width: 360px;
            padding: 40px 20px;
            border-radius: 25px;
            text-align: center;
            margin: 40px 0 20px 0;
            border: 1px solid #2d2d39;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #equation { font-size: 4.5rem; font-weight: 800; margin: 0; }
        #answer-display { font-size: 3.5rem; height: 70px; color: var(--accent); font-weight: bold; margin-top: 10px; }

        /* --- Keyboard --- */
        .keyboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%; max-width: 400px; margin-top: auto; padding-bottom: 20px; }
        .key { background: #2d2d39; height: 65px; display: flex; align-items: center; justify-content: center; border-radius: 12px; font-size: 1.6rem; font-weight: bold; }
        .key:active { background: #4b4b5e; transform: scale(0.96); }
        .key.enter { background: var(--accent); color: #000; grid-column: span 2; }
        .key.del { color: var(--danger); }

        button.mode-btn {
            width: 100%; max-width: 300px; padding: 15px; margin: 5px 0;
            background: #1f1f29; color: white; border: 1px solid #2d2d39;
            border-radius: 12px; font-size: 1rem; font-weight: bold;
        }
        button.mode-btn:active { background: #2d2d39; }
        #clear-history { font-size: 0.7rem; color: #555; background: none; border: none; text-decoration: underline; margin-top: 10px; }

    </style>
</head>
<body>

    <div id="setup-screen" class="screen">
        <h1>Math Blitz</h1>
        <button class="mode-btn" onclick="startGame(10, 'Relaxed')">🐢 Relaxed (10s)</button>
        <button class="mode-btn" onclick="startGame(5, 'Standard')">⚡ Standard (5s)</button>
        <button class="mode-btn" onclick="startGame(3, 'Insane')">🔥 Insane (3s)</button>

        <div class="history-container">
            <div class="history-header">
                <span>MODE</span>
                <span>SCORE</span>
                <span>DATE</span>
            </div>
            <div id="history-list">
                </div>
            <center><button id="clear-history" onclick="clearHistory()">Clear History</button></center>
        </div>
    </div>

    <div id="game-screen" class="screen hidden">
        <div id="timer-bar"></div>
        
        <div class="flash-card">
            <div id="equation">-- × --</div>
            <div id="answer-display"></div>
        </div>

        <div class="keyboard">
            <div class="key" onclick="tap('1')">1</div>
            <div class="key" onclick="tap('2')">2</div>
            <div class="key" onclick="tap('3')">3</div>
            <div class="key" onclick="tap('4')">4</div>
            <div class="key" onclick="tap('5')">5</div>
            <div class="key" onclick="tap('6')">6</div>
            <div class="key" onclick="tap('7')">7</div>
            <div class="key" onclick="tap('8')">8</div>
            <div class="key" onclick="tap('9')">9</div>
            <div class="key del" onclick="tap('C')">C</div>
            <div class="key" onclick="tap('0')">0</div>
            <div class="key enter" onclick="tap('E')">ENTER</div>
        </div>
    </div>

    <script>
        let deck = [], curIdx = 0, input = "", timeLimit = 5, modeName = "Standard";
        let timer, score = 0;
        let history = JSON.parse(localStorage.getItem('mathHistory')) || [];

        function updateHistoryUI() {
            const list = document.getElementById('history-list');
            list.innerHTML = history.length === 0 ? '<div style="text-align:center; padding:20px; color:#444;">No attempts yet</div>' : '';
            
            // Show last 20 attempts
            history.slice().reverse().forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <span class="lvl-${item.mode.toLowerCase()}">${item.mode}</span>
                    <span style="font-weight:bold">${item.score}</span>
                    <span style="color:#555">${item.date}</span>
                `;
                list.appendChild(div);
            });
        }

        function makeDeck() {
            let d = [];
            for(let i=1; i<=9; i++) {
                for(let j=1; j<=9; j++) d.push({n1:i, n2:j, a:i*j});
            }
            return d.sort(() => Math.random() - 0.5);
        }

        function startGame(s, label) {
            timeLimit = s;
            modeName = label;
            score = 0;
            deck = makeDeck();
            curIdx = 0;
            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            ask();
        }

        function ask() {
            if(curIdx >= deck.length) { deck = makeDeck(); curIdx = 0; }
            input = "";
            document.getElementById('answer-display').innerText = "";
            document.getElementById('equation').innerText = `${deck[curIdx].n1} × ${deck[curIdx].n2}`;
            startTimer();
        }

        function startTimer() {
            clearInterval(timer);
            const bar = document.getElementById('timer-bar');
            let start = Date.now();
            timer = setInterval(() => {
                let rem = (timeLimit * 1000) - (Date.now() - start);
                bar.style.width = (rem / (timeLimit * 1000) * 100) + "%";
                if(rem <= 0) end("Time's up!");
            }, 30);
        }

        function tap(k) {
            if(k === 'C') input = "";
            else if(k === 'E') {
                if(parseInt(input) === deck[curIdx].a) {
                    score++;
                    curIdx++;
                    ask();
                } else { end("Wrong!"); }
                return;
            } else {
                if(input.length < 2) input += k;
            }
            document.getElementById('answer-display').innerText = input;
        }

        function end(msg) {
            clearInterval(timer);
            
            // Save to history
            const now = new Date();
            const dateStr = (now.getMonth()+1) + "/" + now.getDate();
            history.push({ mode: modeName, score: score, date: dateStr });
            localStorage.setItem('mathHistory', JSON.stringify(history));

            alert(`${msg}\nFinal Score: ${score}`);
            
            updateHistoryUI();
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('game-screen').classList.add('hidden');
        }

        function clearHistory() {
            if(confirm("Delete all history?")) {
                history = [];
                localStorage.removeItem('mathHistory');
                updateHistoryUI();
            }
        }

        // Initialize UI
        updateHistoryUI();
    </script>
</body>
</html>
